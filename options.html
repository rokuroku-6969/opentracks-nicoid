<!DOCTYPE html>
<html lang='ja'>

<head>
  <meta charset='UTF-8'>
  <title>ファイル名パターン設定</title>
  <style>
    div {
      padding: 0.5rem 1rem;
    }

    p {
      margin: 0.2rem 0 1rem;
    }

    input[type="text"] {
      width: 90%;
    }

    label {
      margin-top: 0.5rem;
    }

    table {
      border-collapse: collapse;
    }

    table tr,
    table th,
    table td {
      border: solid 1px #001e3b;
      padding: 0.2em;
    }
  </style>
</head>

<body>
  <div class='form-group'>
    <label for='patternWithId'>ファイル名パターン</label>
    <input type='text' id='patternWithId' placeholder='${title}_${Id}' maxlength="50">
    <p>デフォルト：　${title}_${Id}</p>
  </div>
  <div class='form-group'>
    <label for='patternNoId'>IDがない場合のファイル名パターン</label>
    <input type='text' id='patternNoId' placeholder='${title}' maxlength="50">
    <p>デフォルト：　${title}</p>
  </div>

  <div class='description'>
    <table style='border-collapse: collapse;'>
      <tr>
        <th>パタ－ン</th>
        <th>説明</th>
      </tr>
      <tr>
        <td>${title}</td>
        <td>タイトル</td>
      </tr>
      <tr>
        <td>${Id}</td>
        <td>ID</td>
      </tr>
      <tr>
        <td>${creator}</td>
        <td>製作者名</td>
      </tr>
    </table>
  </div>

  <script src='options.js'></script>
</body>

</html>
